<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>주문 알림 · 관리 화면</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --navy:#1f3a5f; --card:#eef3f9; --muted:#666; --ok:#1e7d4f; --bad:#b00020; }
  * { box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', Arial, sans-serif; margin: 0 auto; padding: 16px; color: #222; font-size: 14px; max-width: 520px; }
  #gate { text-align: center; padding-top: 40px; }
  #gate input { width: 160px; text-align: center; font-size: 22px; letter-spacing: 6px; margin: 12px auto; display: block; }
  #main { display: none; }
  h2 { color: var(--navy); font-size: 16px; margin: 4px 0 10px; }
  h3 { font-size: 13px; margin: 18px 0 8px; color: var(--navy); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: var(--card); border-radius: 8px; padding: 10px; text-align: center; }
  .card .n { font-size: 22px; font-weight: 700; color: var(--navy); }
  .card .l { color: var(--muted); font-size: 12px; }
  .call { background: #fde8ea; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .call li { margin: 2px 0; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid #c9d3df; border-radius: 6px; font: inherit; }
  textarea { height: 92px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { background: #fff; border: 1px solid #c9d3df; border-radius: 12px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  .chip:hover { border-color: var(--navy); }
  .preview { background: #fffbe6; border: 1px solid #f0e1a0; border-radius: 8px; padding: 10px; white-space: pre-wrap; margin-top: 6px; }
  .preview.err { background: #fde8ea; border-color: #f3b5bd; color: var(--bad); }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; padding: 9px; border: 0; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
  .primary { background: var(--navy); color: #fff; }
  .ghost { background: var(--card); color: var(--navy); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 10px; min-height: 18px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
</style>
</head>
<body>
  <div id="gate">
    <h2>🌷 주문 알림</h2>
    <div style="color:#666">관리 PIN을 입력해주세요</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" onkeydown="if(event.key==='Enter')unlock()">
    <button class="primary" style="width:160px" onclick="unlock()">열기</button>
    <div class="msg" id="gateMsg"></div>
  </div>
  <div id="main">
  <h2>🌷 주문 알림</h2>

  <div class="cards">
    <div class="card"><div class="n" id="tomorrow">-</div><div class="l">내일 받을 손님</div></div>
    <div class="card"><div class="n" id="pending">-</div><div class="l">오늘 저녁 발송 예정</div></div>
  </div>
  <div class="call" id="callBox" style="display:none">
    <b>📞 직접 연락 필요</b><ul id="callList" style="margin:4px 0 0 16px;padding:0"></ul>
  </div>
  <div class="row">
    <button class="ghost" onclick="run('sync', '주문을 가져왔어요')">지금 주문 가져오기</button>
    <button class="ghost" onclick="run('send', '내일 알림을 보냈어요')">지금 알림 보내기</button>
  </div>

  <h3>설정</h3>
  <label for="shopName">가게명</label>
  <input id="shopName" oninput="preview()">

  <label for="sendHour">매일 알림 보낼 시각</label>
  <select id="sendHour"></select>

  <label for="template">알림 문구</label>
  <textarea id="template" oninput="preview()"></textarea>
  <div class="chips" id="chips"></div>

  <label>손님이 받는 메시지 (미리보기)</label>
  <div class="preview" id="preview">불러오는 중…</div>

  <label for="ownerEmail">실패하면 알림 받을 이메일</label>
  <input id="ownerEmail" placeholder="비워두면 메일을 안 보내요">

  <label for="mode">모드</label>
  <select id="mode"><option>데모</option><option>실제</option></select>

  <div class="row"><button class="primary" id="save" onclick="save()">저장</button></div>
  <div class="msg" id="msg"></div>
  </div>

<script>
  // 주소 # 뒤(서버로 안 감)에 s=배포id&t=링크토큰 이 들어 있다
  const params = new URLSearchParams(location.hash.slice(1));
  const API = 'https://script.google.com/macros/s/' + (params.get('s') || '') + '/exec';
  const TOKEN = params.get('t') || '';
  let PIN = '';
  // text/plain 단순 요청 + 쿠키 없음 → 구글 다계정 버그 영향 없음
  function call(action, payload) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, pin: PIN, action: action, payload: payload || null }) })
      .then(r => { if (!r.ok) throw new Error('서버 연결 실패 (' + r.status + ')'); return r.json(); })
      .then(r => { if (r && r.ok === false) throw new Error(r.message); return r && r.data; });
  }
  function unlock() {
    PIN = el('pin').value.trim();
    el('gateMsg').textContent = '확인 중…'; el('gateMsg').className = 'msg ok';
    call('data').then(d => { el('gate').style.display = 'none'; el('main').style.display = 'block'; fill(d); })
      .catch(e => { el('gateMsg').textContent = e.message; el('gateMsg').className = 'msg bad'; });
  }
  const VARS = ['#{가게명}','#{고객명}','#{상품명}','#{수량}','#{금액}','#{날짜}','#{주문번호}'];
  let sample = null;

  function el(id) { return document.getElementById(id); }
  function say(text, ok) { const m = el('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'bad'); }

  function fill(data) {
    sample = data.sample;
    el('tomorrow').textContent = data.today.tomorrowCount;
    el('pending').textContent = data.today.pendingTomorrow;
    const calls = data.today.needsCall;
    el('callBox').style.display = calls.length ? 'block' : 'none';
    el('callList').innerHTML = calls.map(c => '<li>' + c.name + ' · ' + c.phone + ' (' + c.date + ')</li>').join('');
    el('shopName').value = data.settings.shopName;
    el('template').value = data.settings.template;
    el('ownerEmail').value = data.settings.ownerEmail || '';
    el('mode').value = data.settings.mode === 'LIVE' ? '실제' : '데모';
    const sel = el('sendHour');
    sel.innerHTML = Array.from({ length: 24 }, (_, h) => '<option value="' + h + '">' + (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + '시</option>').join('');
    sel.value = data.settings.sendHour;
    preview();
  }

  function preview() {
    if (!sample) return;
    const vars = Object.assign({}, sample, { '#{가게명}': el('shopName').value });
    const t = el('template').value;
    const unknown = (t.match(/#\{[^}]+\}/g) || []).filter(v => !(v in vars));
    const box = el('preview');
    if (!t.trim()) { box.textContent = '문구를 입력해주세요'; box.className = 'preview err'; return; }
    if (unknown.length) { box.textContent = '알 수 없는 변수: ' + unknown.join(', ') + '\n아래 버튼으로 넣어주세요.'; box.className = 'preview err'; return; }
    box.textContent = t.replace(/#\{[^}]+\}/g, v => vars[v]);
    box.className = 'preview';
  }

  function insertVar(v) {
    const ta = el('template'); const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + v + ta.value.slice(e);
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + v.length; preview();
  }

  function save() {
    el('save').disabled = true; say('저장 중…', true);
    call('save', {
        shopName: el('shopName').value, sendHour: Number(el('sendHour').value), template: el('template').value,
        ownerEmail: el('ownerEmail').value, mode: el('mode').value,
      })
      .then(d => { el('save').disabled = false; say('저장했어요. 발송 시각도 다시 맞췄어요 ✅', true); fill(d); })
      .catch(e => { el('save').disabled = false; say(e.message, false); });
  }

  function run(fn, done) {
    say('실행 중…', true);
    call(fn).then(d => { say(done + ' ✅', true); fill(d); }).catch(e => say(e.message, false));
  }

  function load() {
    call('data').then(fill).catch(e => say(e.message, false));
  }

  el('chips').innerHTML = VARS.map(v => '<span class="chip" onclick="insertVar(\'' + v + '\')">' + v.slice(2, -1) + '</span>').join('');
  if (!params.get('s') || !TOKEN) { el('gateMsg').textContent = '링크가 올바르지 않아요. 시트의 «관리 화면 링크»에서 받은 주소로 열어주세요.'; el('gateMsg').className = 'msg bad'; }
  el('pin').focus();
</script>
</body>
</html>
